aid: streambased
name: Streambased
description: >-
  Streambased unifies Apache Kafka and Apache Iceberg into a single queryable
  view, making real-time streaming data and historical table data accessible
  together without copying data, building new pipelines, or changing existing
  tools. Its zero-copy architecture turns live Kafka topics into Iceberg tables
  queryable with SQL in milliseconds, while metadata, schema rules, and access
  controls carry over from Kafka to Iceberg for unified governance. The platform
  ships as Streambased Cloud (managed) and the Streambased Platform components
  I.S.K. (Iceberg Service for Kafka), K.S.I. (Kafka Service for Iceberg),
  Hyperstream, and Slipstream, and is consumed through the Apache Iceberg REST
  catalog interface and native Apache Kafka protocol using per-cluster API keys.
  Backed by Seedcamp.
